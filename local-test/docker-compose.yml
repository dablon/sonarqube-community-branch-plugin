services:
  db:
    image: postgres:16
    container_name: cbp-db
    networks: [cbpnet]
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - cbp_pg:/var/lib/postgresql/data

  sonarqube:
    build:
      context: ..
      dockerfile: local-test/Dockerfile.sonarqube
    image: cbp-sonarqube:26.10
    container_name: cbp-sonarqube
    depends_on:
      db:
        condition: service_healthy
    networks: [cbpnet]
    ports:
      - "19000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - cbp_sq_data:/opt/sonarqube/data
      - cbp_sq_logs:/opt/sonarqube/logs

volumes:
  cbp_pg:
  cbp_sq_data:
  cbp_sq_logs:

networks:
  cbpnet:
